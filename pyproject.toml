[project]
name = "adt-utils"
description = "Utilities for ADT HTML standardization, validation, translation, and TTS"
authors = [
    { name = "Guillermo Bergengruen", email = "gbergengruen@unicef.org" },
    { name = "Elias Constantopedos", email = "econstantopedos@unicef.org" },
    { name = "Ignacio Aristimuño", email = "ignacio.a@marvik.ai" },
]
license = "MIT"
version = "1.0.0"
requires-python = ">=3.8, <4.0"
dependencies = [
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "openai",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.urls]
homepage = "https://github.com/unicef/adt-utils"
repository = "https://github.com/unicef/adt-utils"
documentation = "https://github.com/unicef/adt-utils/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "src"
